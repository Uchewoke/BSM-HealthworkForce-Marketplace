#cloud-config
# First-boot configuration for the API Droplet. Paste this as "User data" when creating the Droplet (Ubuntu 24.04 LTS,
# 2 GB RAM without virus scanning, 4 GB once the scanner profile is on: clamd alone needs about 1.3 GB). Replace the SSH public
# key below with your own before use.
# What it does: a non-root user that can run Docker, SSH by key only, a firewall that admits only 22/80/443, unattended
# security updates, fail2ban for SSH, and Docker Engine with the Compose plugin from Docker's repository.

users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-ed25519 AAAA...replace-with-your-public-key... you@laptop

package_update: true
package_upgrade: true
packages: [ca-certificates, curl, gnupg, ufw, fail2ban, unattended-upgrades, git]

write_files:
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      X11Forwarding no
      MaxAuthTries 3
  - path: /etc/apt/apt.conf.d/52unattended-upgrades-local
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";
  - path: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      bantime = 1h
  - path: /etc/docker/daemon.json
    content: |
      { "log-driver": "json-file", "log-opts": { "max-size": "20m", "max-file": "5" }, "live-restore": true }

runcmd:
  # Docker Engine + Compose plugin (Docker's repository; Ubuntu's docker.io lags behind)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - . /etc/os-release && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable --now docker
  # Firewall: SSH, HTTP (ACME challenge and redirect), HTTPS. Docker publishes 80/443 through its own chain; ufw still blocks everything else.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable
  - systemctl enable --now fail2ban
  - systemctl restart ssh
  - dpkg-reconfigure -f noninteractive unattended-upgrades
  - mkdir -p /opt/bsm && chown deploy:deploy /opt/bsm

final_message: "BSM API Droplet ready after $UPTIME seconds. Next: ssh deploy@<ip>, clone the repository into /opt/bsm and follow infrastructure/deployment/droplet/README.md."
