# nginx site for the API when the Droplet already runs nginx (compose.nginx.yml). Install:
#   sudo cp nginx-api.conf /etc/nginx/sites-available/bsm-api
#   sudo nano /etc/nginx/sites-available/bsm-api          # replace api.example.com with your API_DOMAIN
#   sudo ln -s /etc/nginx/sites-available/bsm-api /etc/nginx/sites-enabled/bsm-api
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.example.com --redirect      # adds HTTPS on 443 and the HTTP-to-HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    client_max_body_size 12m;   # same cap as the Caddyfile; uploads are limited to 10 MB by the API

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the API trusts exactly one proxy hop (trust proxy = 1), so per-IP rate limits use this value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/bsm-api.access.log;
    error_log /var/log/nginx/bsm-api.error.log;
}
